<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML-блокнот</title>

<style>
:root {
  /* Layout: top bar, then editor | preview split; stacks on narrow or portrait screens; key bar sits above the keyboard on touch screens */
  --bg: #eceef2;
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --ink: #1a1e26;
  --muted: #5d6676;
  --line: #d8dce3;
  --accent: #d2461a;
  --accent-ink: #ffffff;
  --accent-soft: #fbe7df;
  --sel: rgba(210, 70, 26, .25);
  --line-hl: rgba(20, 30, 50, .045);
  --hit: rgba(255, 184, 0, .32);
  --ok: #1f8a4c;
  --warn: #a66300;
  --err: #c4302b;
  --s-tag: #b4321a; --s-attr: #7a4fb0; --s-str: #1d7a52; --s-com: #8a93a1; --s-kw: #1f5fbf;
  --s-num: #a2580b; --s-punc: #687183; --s-prop: #1f5fbf; --s-fn: #7a4fb0;
  --font-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular, Menlo, "Roboto Mono", Consolas, monospace;
  --code-size: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1014; --surface: #171a20; --surface-2: #1e222a; --ink: #e6e9ee; --muted: #8e97a6;
    --line: #2b3039; --accent: #ff6d38; --accent-ink: #1b0c05; --accent-soft: #3a2017;
    --sel: rgba(255, 109, 56, .32); --line-hl: rgba(255, 255, 255, .05); --hit: rgba(255, 196, 0, .25);
    --ok: #4cc27f; --warn: #e3a33c; --err: #ff6b63;
    --s-tag: #ff8b66; --s-attr: #c6a0f5; --s-str: #8ed8a8; --s-com: #6c7584; --s-kw: #80b3ff;
    --s-num: #f0b56c; --s-punc: #8e97a6; --s-prop: #80b3ff; --s-fn: #c6a0f5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1014; --surface: #171a20; --surface-2: #1e222a; --ink: #e6e9ee; --muted: #8e97a6;
  --line: #2b3039; --accent: #ff6d38; --accent-ink: #1b0c05; --accent-soft: #3a2017;
  --sel: rgba(255, 109, 56, .32); --line-hl: rgba(255, 255, 255, .05); --hit: rgba(255, 196, 0, .25);
  --ok: #4cc27f; --warn: #e3a33c; --err: #ff6b63;
  --s-tag: #ff8b66; --s-attr: #c6a0f5; --s-str: #8ed8a8; --s-com: #6c7584; --s-kw: #80b3ff;
  --s-num: #f0b56c; --s-punc: #8e97a6; --s-prop: #80b3ff; --s-fn: #c6a0f5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.4;
  overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; opacity: 0; }
.spacer { flex: 1 1 auto; }

#app {
  position: fixed; left: 0; right: 0; top: var(--app-top, 0px); height: var(--app-h, 100%);
  display: flex; flex-direction: column;
  padding-bottom: var(--tg-safe-area-inset-bottom, 0px);
}
.kb #app { padding-bottom: 0; }

/* Top bar */
.topbar {
  display: flex; align-items: center; gap: 8px; min-height: 54px; flex: none;
  padding: calc(8px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)) 12px 8px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
.brand-mark {
  width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font: 600 11px var(--font-code); letter-spacing: -0.04em;
}
.tg .brand { display: none; }
.proj-btn {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 34vw;
  min-height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--surface-2); cursor: pointer;
}
.proj-btn span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.proj-btn .chev { color: var(--muted); font-size: 12px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.status[data-state="saved"]::before { background: var(--ok); }
.status[data-state="saving"]::before, .status[data-state="connecting"]::before { background: var(--warn); }
.status[data-state="offline"]::before { background: var(--err); }

.seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); flex: none; }
.seg button {
  border: 0; background: transparent; color: var(--muted); font-weight: 500; font-size: 14px;
  min-height: 32px; padding: 0 11px; border-radius: 8px; cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 0 0 1px var(--line); }
.seg.small button { font: 500 12.5px var(--font-code); min-height: 28px; padding: 0 8px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink);
  font: 500 14px/1 var(--font-ui); cursor: pointer; white-space: nowrap; text-decoration: none; flex: none;
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.06); }
.btn.icon { width: 36px; padding: 0; font-size: 20px; letter-spacing: 0.05em; }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
.badge {
  display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--muted); color: var(--surface); font: 600 11px var(--font-ui); font-variant-numeric: tabular-nums;
}
.badge.err { background: var(--err); color: #fff; }

/* Tip */
.tip {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; flex: none;
  background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 13.5px;
}
.tip p { margin: 0; flex: 1; }
.tip code, .tip kbd, .sheet-note code {
  font-family: var(--font-code); font-size: 12.5px; padding: 1px 5px; border-radius: 5px;
  background: var(--surface); border: 1px solid var(--line); white-space: nowrap;
}

/* Main split */
#main { flex: 1 1 auto; display: flex; min-height: 0; }
#main.stack { flex-direction: column; }
.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
#editorPane { flex: 0 0 50%; }
#previewPane { flex: 1 1 0; }
.divider { flex: 0 0 9px; background: var(--bg); cursor: col-resize; touch-action: none; position: relative; }
.divider::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 36px; border-radius: 2px;
  background: var(--line); transform: translate(-50%, -50%);
}
#main.stack .divider { cursor: row-resize; }
#main.stack .divider::after { width: 36px; height: 3px; }
.divider:hover::after, #main.dragging .divider::after { background: var(--accent); }
#main.dragging iframe { pointer-events: none; }
#main[data-view="code"] #previewPane, #main[data-view="code"] .divider,
#main[data-view="preview"] #editorPane, #main[data-view="preview"] .divider { display: none; }
#main[data-view="code"] #editorPane { flex: 1 1 auto; }

/* Editor */
.tabs {
  display: flex; align-items: stretch; gap: 2px; padding: 0 8px; min-height: 40px;
  border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; order: 0;
}
.tabs::-webkit-scrollbar { display: none; }
.tabs [role="tab"] {
  border: 0; background: none; padding: 0 12px; cursor: pointer; white-space: nowrap;
  font: 500 13.5px var(--font-code); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs [role="tab"][aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.pos { align-self: center; padding: 0 4px; font: 12px var(--font-code); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.findbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; flex: none; order: 1;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.findbar input {
  flex: 1 1 150px; min-width: 0; height: 34px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 400 16px var(--font-ui);
}
.findcount { min-width: 46px; text-align: center; font: 12px var(--font-code); color: var(--muted); font-variant-numeric: tabular-nums; }
.findrow { display: flex; align-items: center; gap: 6px; flex: 1 1 260px; min-width: 0; }

.keybar {
  display: flex; gap: 5px; padding: 6px 8px; overflow-x: auto; flex: none; order: 2;
  background: var(--surface-2); border-bottom: 1px solid var(--line); scrollbar-width: none;
  -webkit-user-select: none; user-select: none;
}
.keybar::-webkit-scrollbar { display: none; }
.keybar button {
  flex: none; min-width: 38px; height: 36px; padding: 0 8px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 500 16px var(--font-code); touch-action: manipulation;
}
.keybar button.acc { color: var(--accent); font-weight: 600; }
.keybar button.word { font: 600 13px var(--font-ui); }
.keybar button:active { background: var(--accent-soft); }
.keybar .sep { flex: none; width: 1px; background: var(--line); margin: 4px 2px; }

.editor { position: relative; flex: 1 1 auto; min-height: 0; order: 3; --digits: 2; --gutter: calc(var(--digits) * 1ch + 26px); }
.editor:focus-within { box-shadow: inset 0 2px 0 var(--accent); }
.editor textarea, .editor pre {
  position: absolute; inset: 0; margin: 0; padding: 12px 14px 14px var(--gutter); border: 0;
  font-family: var(--font-code); font-size: var(--code-size); line-height: 1.55; font-weight: 400; font-style: normal;
  letter-spacing: 0; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0;
  tab-size: 2; -moz-tab-size: 2;
  white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word; word-break: normal;
  text-align: left; text-indent: 0; text-transform: none;
}
.editor pre {
  pointer-events: none; overflow: hidden; color: var(--ink);
  background: linear-gradient(to right, var(--surface-2) calc(var(--gutter) - 8px), transparent calc(var(--gutter) - 8px));
}
.editor pre code { display: block; font: inherit; counter-reset: ln; }
.ln { display: block; position: relative; }
.ln::before {
  content: counter(ln); counter-increment: ln; position: absolute; right: 100%; top: 0;
  width: var(--gutter); padding-right: 16px; text-align: right; color: var(--s-com); opacity: .75;
}
.ln.cur { background: var(--line-hl); }
.ln.cur::before { color: var(--ink); opacity: 1; }
.ln.hit { background: var(--hit); }
.editor textarea {
  z-index: 1; resize: none; outline: none; overflow: auto; background: transparent;
  color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--accent);
  scrollbar-width: none;
}
.editor textarea::-webkit-scrollbar { display: none; width: 0; height: 0; }
.editor textarea::selection { background: var(--sel); }

.token.comment, .token.prolog, .token.doctype, .token.cdata { color: var(--s-com); }
.token.punctuation, .token.operator { color: var(--s-punc); }
.token.tag, .token.selector, .token.important { color: var(--s-tag); }
.token.attr-name, .token.function, .token.class-name { color: var(--s-fn); }
.token.attr-value, .token.attr-value .token.punctuation, .token.string, .token.url, .token.template-string { color: var(--s-str); }
.token.property, .token.keyword, .token.boolean, .token.atrule, .token.rule { color: var(--s-kw); }
.token.number, .token.entity, .token.regex, .token.unit, .token.hexcode { color: var(--s-num); }
.token.interpolation { color: var(--ink); }

/* Preview */
.preview-head {
  display: flex; align-items: center; gap: 8px; padding: 5px 8px; min-height: 40px; flex: none;
  background: var(--surface-2); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none;
}
.preview-head::-webkit-scrollbar { display: none; }
.wread { font: 12px var(--font-code); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
.switch input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
.stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: var(--bg); }
.frame-box { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: top center; background: #fff; }
.stage.framed .frame-box { border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 10px 28px rgba(0,0,0,.14); }
.frame-box iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff; }
.stale {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2;
  padding: 7px 14px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 13px; white-space: nowrap;
}

.console { display: flex; flex-direction: column; flex: 0 0 34%; min-height: 120px; border-top: 1px solid var(--line); background: var(--surface); }
.console-head { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
.console-list { flex: 1; overflow: auto; font: 13px/1.5 var(--font-code); }
.log { padding: 4px 12px; border-bottom: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
.log.warn { color: var(--warn); }
.log.error { color: var(--err); }
.log.info { color: var(--muted); }
.console-empty { padding: 10px 12px; color: var(--muted); font-size: 13px; }

/* Sheets */
.scrim { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8, 10, 14, .48); }
.sheet {
  display: flex; flex-direction: column; width: min(560px, 100%); max-height: 100%;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0,0,0,.3);
}
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 18px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { margin: 0; flex: 1; font-size: 17px; font-weight: 600; text-wrap: balance; }
.sheet-body { display: flex; flex-direction: column; gap: 2px; padding: 8px; overflow: auto; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 10px;
  background: none; color: var(--ink); text-align: left; cursor: pointer; font: inherit;
}
.row:hover { background: var(--surface-2); }
.row.current, .row[aria-pressed="true"] { background: var(--accent-soft); }
.row.static { cursor: default; }
.row.static:hover { background: none; }
.row-main { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.row-title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: 12.5px; color: var(--muted); }
.row.danger .row-title { color: var(--err); }
.row-ico { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font: 600 12px var(--font-code); color: var(--muted); }
.sheet-note { margin: 6px 12px 10px; font-size: 13px; color: var(--muted); line-height: 1.5; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 12px 10px; }
.field { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; }
.field label { font-size: 13px; color: var(--muted); }
.field input {
  font: 400 16px var(--font-ui); padding: 10px 12px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.group-title { margin: 12px 12px 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 12px 6px; }
.chip {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  font: 500 13.5px var(--font-code); cursor: pointer;
}
.chip:hover, .chip:active { border-color: var(--accent); }
.fontctl { display: inline-flex; align-items: center; gap: 6px; }
.fontctl output { min-width: 42px; text-align: center; font: 13px var(--font-code); font-variant-numeric: tabular-nums; }
.imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 4px 12px 12px; }
.img-card { display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.img-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--bg); }
.img-meta { display: flex; flex-direction: column; gap: 6px; padding: 8px; }
.img-name { font: 12.5px var(--font-code); word-break: break-all; }
.img-size { font-size: 12px; color: var(--muted); }
.img-btns { display: flex; gap: 6px; }
.empty { margin: 4px 12px 12px; color: var(--muted); font-size: 14px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + var(--tg-safe-area-inset-bottom, 0px)); z-index: 60; transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px;
  background: var(--ink); color: var(--surface); font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.22);
}

/* Touch screens: key bar right above the keyboard, bigger keys */
@media (pointer: coarse) {
  .keybar { order: 4; border-bottom: 0; border-top: 1px solid var(--line); }
  .keybar button { height: 40px; min-width: 42px; font-size: 17px; }
}
@media (max-width: 760px) {
  .brand-name { display: none; }
  .status { font-size: 0; gap: 0; }
  #runBtn .lbl { display: none; }
  #runBtn { width: 36px; padding: 0; }
  .proj-btn { max-width: 30vw; }
  .seg button { padding: 0 9px; }
}
@media (max-width: 600px) {
  .scrim { align-items: flex-end; padding: 0; }
  .sheet { width: 100%; max-height: 90%; border-radius: 16px 16px 0 0; border-bottom: 0; padding-bottom: var(--tg-safe-area-inset-bottom, 0px); }
}
@media (max-width: 480px) {
  .pos { display: none; }
}
@media (max-width: 420px) {
  .topbar { gap: 6px; padding-left: 8px; padding-right: 8px; }
  .brand { display: none; }
  .proj-btn { max-width: 28vw; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>

    let ok = false; try { ok = document.execCommand('copy'); } catch (x) { ok = false; }
    t.remove();
    toast(ok ? okMsg : 'Скопировать не вышло: выделите код и скопируйте вручную');
  }
}
async function exportFile() {
  const p = cur();
  const name = (p.name.replace(/[\\/:*?"<>|]+/g, '-').trim() || 'index') + '.html';
  const html = compose(p, true);
  if (downloads) {
    try {
      const r = await downloads.save({ filename: name, data: html });
      if (r && r.status === 'saved') toast('Файл сохранён');
    } catch (e) {
      if (e && e.code === 'declined') return;
      toast('Скачать не получилось' + (e && e.code ? ' (' + e.code + ')' : ''));
    }
    return;
  }
  if (canShareFile()) {
    try { await navigator.share({ files: [new File([html], name, { type: 'text/html' })], title: p.name }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (!TG) {
    const url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    const a = el('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('Файл скачивается');
    return;
  }
  copyText(html, 'Страница скопирована целиком');
}

/* ---------- wiring ---------- */
function updateHeader() { $('#projName').textContent = cur() ? cur().name : 'Проект'; }
function switchProject(id, force) {
  if (!projects[id]) return;
  if (id === currentId && !force) { loadEditor(); return; }
  flushAll();
  if (id !== currentId) rememberView();
  currentId = id; store.set('hp.current', id);
  lastScrollY = 0;
  updateHeader(); loadEditor(); runPreview();
}
$$('.tabs [role="tab"]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$$('#viewSeg button').forEach(b => b.addEventListener('click', () => { haptic('tick'); setView(b.dataset.view); }));
$$('#devSeg button').forEach(b => b.addEventListener('click', () => { settings.device = b.dataset.w; saveSettings(); layoutFrame(); }));
$('#runBtn').addEventListener('click', () => {
  flushAll(); runPreview();
  if (isNarrow() && settings.view === 'code') setView('preview');
});
$('#menuBtn').addEventListener('click', showMenu);
$('#projBtn').addEventListener('click', showProjects);
$('#consoleBtn').addEventListener('click', () => setConsole($('#console').hidden));
$('#closeLog').addEventListener('click', () => setConsole(false));
$('#clearLog').addEventListener('click', clearLogs);
$('#autorun').addEventListener('change', e => { settings.autorun = e.target.checked; saveSettings(); if (settings.autorun) runPreview(); });
$('#tipClose').addEventListener('click', () => { settings.tip = false; saveSettings(); $('#tip').hidden = true; applyLayout(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll(); });
window.addEventListener('pagehide', flushAll);

/* ---------- start ---------- */
fitViewport();
ensureProject();
document.documentElement.style.setProperty('--code-size', settings.fontSize + 'px');
$('#autorun').checked = !!settings.autorun;
$('#tip').hidden = !settings.tip;
setView(settings.view || (isNarrow() ? 'code' : 'split'));
setConsole(!!settings.consoleOpen);
updateHeader();
loadEditor();
applyLayout();
clearLogs();
runPreview();
refreshSync();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { renderHL(); });
if (TG) { try { TG.ready(); } catch (e) { /* ignore */ } }
setTimeout(connect, 0);
})();
</script>
